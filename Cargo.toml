[package]
name = "monitor-agent"
version = "0.1.0-alpha"
edition = "2024"
description = ""
repository = ""
documentation = ""
license = ""

[[bin]]
name = "monitor-agent"
path = "src/main.rs"

[dependencies]
pcap = "2.4.0"
pnet = "0.35.0"

tonic = { version = "0.13", features = ["transport"] }
prost = { version = "0.13" }
prost-types = { version = "0.13" }

blake3 = { version = "1" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal"] }
tokio-stream = { version = "0.1" }
tokio-util = { version = "0.7", features = ["rt"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

rand = { version = "0.10" }
uuid = { version = "1", features = ["v4"] }
dirs = { version = "5" }

clap = { version = "4.5.60", features = ["derive", "env"] }

thiserror = "2"
anyhow = "1"

# IDS dependencies
dashmap = "6"
aho-corasick = "1"
bloomfilter = "1"
maxminddb = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"

# [dev-dependencies] used for tests

[build-dependencies]
tonic-build = { version = "0.13" }
protox = { version = "0.7" }

# cargo test
[profile.dev]

# cargo bench
[profile.release]
lto = "thin"
panic = "abort"
