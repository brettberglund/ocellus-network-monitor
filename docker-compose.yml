# monitor-agent — generates synthetic packets, streams to a gRPC backend.
# GRPC_ADDR defaults to a placeholder; the agent connects lazily so it keeps
# running (retrying in the background) even if that backend isn't reachable.
services:
  monitor-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: monitor-agent:dev
    container_name: monitor-agent
    restart: unless-stopped
    environment:
      RUST_LOG: ${RUST_LOG:-info}
    command: >
      --test-send
      --agent-id agent-docker-01
      --grpc-addr ${GRPC_ADDR:-http://localhost:50051}
      --test-packets-per-tick 20
      --test-tick-ms 200